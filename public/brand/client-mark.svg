<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Institution mark">
  <!--
    A neutral placeholder mark.

    Deliberately abstract and wordmark free. Shipping a real institution or
    consultancy logo into a repository that holds a synthetic institution would
    misuse the trademark and imply an endorsement that does not exist, so the
    placeholder is geometry only and the organisation name is rendered as text
    beside it by the shell.

    Three nested arcs: three legal entities under one group.
  -->
  <rect x="0.5" y="0.5" width="23" height="23" rx="5" fill="#161a20" stroke="#2a3038" />
  <path d="M7 17.5V11.5a5 5 0 0 1 10 0v6" fill="none" stroke="#f4f6f8" stroke-width="1.7" stroke-linecap="round" />
  <path d="M10 17.5v-5.6a2 2 0 0 1 4 0v5.6" fill="none" stroke="#8b96a6" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="12" cy="7" r="1.4" fill="#8b82ff" />
</svg>
