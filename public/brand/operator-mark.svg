    top of, the institution.
  -->
  <rect x="0.5" y="0.5" width="23" height="23" rx="5" fill="#161a20" stroke="#2a3038" />
  <path d="M6 16.5 12 6l6 10.5" fill="none" stroke="#f4f6f8" stroke-width="1.7" stroke-linejoin="round" />
  <path d="M8.6 14h6.8" fill="none" stroke="#8b82ff" stroke-width="1.5" stroke-linecap="round" />
</svg>
