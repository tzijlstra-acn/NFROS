<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Operator mark">
  <!--
    The operator placeholder mark. Same reasoning as client-mark.svg: abstract
    geometry, no wordmark, no real trademark artwork.

