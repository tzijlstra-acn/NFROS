name: Nightly Live Evaluation

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC

jobs:
  live-eval:
    runs-on: ubuntu-latest
    if: ${{ secrets.OPENAI_MINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Live evaluation
        run: npm run eval:live
        env:
          OPENAI_MINI_API_KEY: ${{ secrets.OPENAI_MINI_API_KEY }}
        continue-on-error: true  # Report result, do not break build
