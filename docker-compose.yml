version: "3.9"
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PRODUCT_MODE=demonstration
      - SESSION_SECRET=${SESSION_SECRET:-nfros-local-dev-secret-not-for-production}
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - nfros-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  nfros-data:
    driver: local
